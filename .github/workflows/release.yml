---
# PyPI publish for the canonical `hermes-mordred` package and its legacy
# `mordred-hermes` compatibility project. workflow_dispatch only — never
# auto-runs, because publishing to PyPI is an irreversible external
# action (a deleted version/filename can never be re-uploaded).
#
# Restored after the Mordred-Hermes-monorepo -> standalone-repo split
# (2026-07-06). Paths adapted: the package now builds from the repo root
# instead of the old `mordred-hermes/` subdirectory.
#
# Four modes:
#   reserve  — historical build route for the empty 0.0.0.dev0 stub
#              (packaging/name-reservation/) to claim the
#              `mordred-hermes` name before the public docs launch.
#              Already published to both indexes; do not dispatch again.
#   reserve-rename — historical build route for the separate 0.0.0.dev0 stub
#              (packaging/hermes-mordred-reservation/) to claim the future
#              `hermes-mordred` distribution name before the rename lands.
#              Already published to both indexes; do not dispatch again.
#   release  — builds the real `hermes-mordred` package (repo root).
#   compat   — builds the metadata-only `mordred-hermes` compatibility shim.
#              Publish only after the matching real release exists.
#
# Authentication is PyPI Trusted Publishing (OIDC) — NO API tokens are
# stored. Both distribution projects trust workflow `release.yml`, with
# environment `pypi` / `testpypi` respectively. Full operator runbook:
# docs/dev/CI.md §"release.yml details" §"Initial setup".

name: Release (PyPI publish)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target index"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      mode:
        description: "reserve = legacy stub | reserve-rename = new stub | release = real package | compat = old-name shim"
        required: true
        type: choice
        options:
          - reserve
          - reserve-rename
          - release
          - compat
        default: reserve
      expected-version:
        description: >-
          Exact canonical PEP 440 version expected in both artifacts.
          Keep 0.0.0.dev0 for reservation modes; set the bumped package
          version for real and compatibility releases.
        required: true
        type: string
        default: "0.0.0.dev0"
      skip-ci-gate:
        description: >-
          TestPyPI-only escape hatch: skip the "ci.yml passed on this SHA"
          gate for an old commit whose retained check-runs have expired.
          Production PyPI rejects this input unconditionally.
        required: false
        type: boolean
        default: false

# Never publish two builds to the same index concurrently. Not cancelled
# in-progress: an interrupted upload could leave a half-published release.
concurrency:
  group: release-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail-closed CI gate. Branch protection and the `pypi` Environment's
  # required-reviewer gate are both unavailable on the current billing plan
  # (private repo; see docs/dev/CI.md §"Initial setup" deviation note), so
  # without this job a single workflow_dispatch could build and publish an
  # untested commit straight to production PyPI. This job blocks `build`
  # (and transitively `publish`, via `needs`) unless a completed ci.yml run
  # with conclusion == "success" exists for the exact SHA being released.
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Narrowest possible grant: only this job needs to read workflow-run
      # history via the Actions API. A job-level `permissions:` block
      # overrides (does not merge with) the workflow-level one, so `build`
      # and `publish` are unaffected and stay at their existing scopes.
      actions: read
    steps:
      - name: Validate target, ref, and release inputs
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          SKIP_CI_GATE: ${{ inputs.skip-ci-gate }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$TARGET" = "pypi" ] && [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Production PyPI releases are allowed only from refs/heads/main; got $RELEASE_REF."
            exit 1
          fi
          if [ "$TARGET" = "pypi" ] && [ "$SKIP_CI_GATE" = "true" ]; then
            echo "::error::skip-ci-gate is prohibited for production PyPI releases."
            exit 1
          fi
          if { [ "$MODE" = "reserve" ] || [ "$MODE" = "reserve-rename" ]; } && [ "$EXPECTED_VERSION" != "0.0.0.dev0" ]; then
            echo "::error::reservation modes require expected-version=0.0.0.dev0."
            exit 1
          fi
          if { [ "$MODE" = "release" ] || [ "$MODE" = "compat" ]; } && { [ -z "$EXPECTED_VERSION" ] || [ "$EXPECTED_VERSION" = "0.0.0.dev0" ]; }; then
            echo "::error::release and compat modes require the real, bumped expected-version."
            exit 1
          fi

          if [ "$MODE" = "compat" ]; then
            if [ "$TARGET" = "testpypi" ]; then
              canonical_json="https://test.pypi.org/pypi/hermes-mordred/${EXPECTED_VERSION}/json"
            else
              canonical_json="https://pypi.org/pypi/hermes-mordred/${EXPECTED_VERSION}/json"
            fi
            if ! curl --fail --silent --show-error "$canonical_json" >/dev/null; then
              echo "::error::Publish hermes-mordred==${EXPECTED_VERSION} to ${TARGET} before its mordred-hermes compatibility shim."
              exit 1
            fi
          fi

      - name: Warn loudly when the CI gate is being skipped
        if: ${{ inputs.skip-ci-gate }}
        run: |
          echo "::warning::skip-ci-gate=true — BYPASSING the ci.yml success gate for TestPyPI at $GITHUB_SHA. Production PyPI rejects this input."

      - name: Require a green ci.yml run on this exact SHA
        if: ${{ !inputs.skip-ci-gate }}
        env:
          # gh CLI reads GH_TOKEN automatically; env indirection (not inline
          # ${{ }} in the script body) matches the pattern integration-vpn.yml
          # uses for MULLVAD_VERSION — untrusted-shaped values never get
          # interpolated directly into the shell command.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Checking for a successful ci.yml run on $REPO @ $SHA ..."
          success_count=$(gh api "/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --paginate --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | wc -l | tr -d ' ')
          if [ "$success_count" -lt 1 ]; then
            echo "::error::No completed ci.yml run with conclusion=success found for commit $SHA. Refusing to build/publish an unverified commit. Ensure ci.yml has passed on this exact SHA. The skip-ci-gate escape hatch is TestPyPI-only."
            exit 1
          fi
          echo "Found $success_count successful ci.yml run(s) for $SHA — proceeding."

  build:
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build + twine
        run: python -m pip install --upgrade pip build twine

      - name: Resolve project contract for ${{ inputs.mode }} mode
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          mode = os.environ["MODE"]
          contract = tomllib.loads(
              Path("packaging/release-projects.toml").read_text(encoding="utf-8")
          )["mode"]
          try:
              project = contract[mode]
          except KeyError as exc:
              raise SystemExit(f"::error::Unsupported release mode: {mode}") from exc

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"dir={project['directory']}\n")
              stream.write(f"name={project['name']}\n")
              stream.write(f"reservation={str(project['reservation']).lower()}\n")
          PY

      - name: Validate requested version against source
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          MODE: ${{ inputs.mode }}
          PROJECT_DIR: ${{ steps.resolve.outputs.dir }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          from packaging.version import InvalidVersion, Version

          expected = os.environ["EXPECTED_VERSION"]
          try:
              canonical = str(Version(expected))
          except InvalidVersion as exc:
              raise SystemExit(f"::error::expected-version is not valid PEP 440: {exc}") from exc
          if canonical != expected:
              raise SystemExit(
                  f"::error::expected-version must be canonical PEP 440; "
                  f"got {expected!r}, canonical form is {canonical!r}"
              )

          mode = os.environ["MODE"]
          project_dir = Path(os.environ["PROJECT_DIR"])
          project_metadata = tomllib.loads(
              (project_dir / "pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          source_version = project_metadata.get("version")
          if source_version is None:
              about = ast.parse(
                  (project_dir / "src/mordred_hermes/__about__.py").read_text(
                      encoding="utf-8"
                  )
              )
              for node in about.body:
                  if (
                      isinstance(node, ast.Assign)
                      and any(
                          isinstance(target, ast.Name)
                          and target.id == "__version__"
                          for target in node.targets
                      )
                      and isinstance(node.value, ast.Constant)
                      and isinstance(node.value.value, str)
                  ):
                      source_version = node.value.value
                      break
              if source_version is None:
                  raise SystemExit("::error::Could not read __version__ from __about__.py")

          if source_version != expected:
              raise SystemExit(
                  f"::error::Source version {source_version!r} does not match "
                  f"expected-version {expected!r}"
              )
          print(f"Validated {mode} source version: {expected}")
          PY

      - name: Build sdist + wheel
        run: python -m build --outdir dist "${{ steps.resolve.outputs.dir }}"

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Guard artifact count, name, and exact version
        env:
          EXPECTED_NAME: ${{ steps.resolve.outputs.name }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          expected_name = os.environ["EXPECTED_NAME"]
          expected = os.environ["EXPECTED_VERSION"]
          mode = os.environ["MODE"]
          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"::error::Expected exactly one wheel and one sdist; "
                  f"found wheels={len(wheels)}, sdists={len(sdists)}"
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_members = archive.namelist()
              metadata_paths = [
                  name for name in wheel_members if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit(
                      f"::error::Expected one wheel METADATA file; found {metadata_paths!r}"
                  )
              wheel_metadata = BytesParser().parsebytes(
                  archive.read(metadata_paths[0]), headersonly=True
              )
              if mode == "compat":
                  dist_info_root = metadata_paths[0].removesuffix("METADATA")
                  runtime_members = [
                      name for name in wheel_members if not name.startswith(dist_info_root)
                  ]
                  if runtime_members:
                      raise SystemExit(
                          "::error::Compatibility wheel must be metadata-only; "
                          f"found runtime members {runtime_members!r}"
                      )
                  if any(name.endswith(".dist-info/entry_points.txt") for name in wheel_members):
                      raise SystemExit(
                          "::error::Compatibility wheel must not define console or plugin entry points"
                      )

          with tarfile.open(sdists[0], "r:gz") as archive:
              pkg_info_members = [
                  member
                  for member in archive.getmembers()
                  if member.isfile()
                  and member.name.count("/") == 1
                  and member.name.endswith("/PKG-INFO")
              ]
              if len(pkg_info_members) != 1:
                  raise SystemExit(
                      f"::error::Expected one top-level sdist PKG-INFO; "
                      f"found {[m.name for m in pkg_info_members]!r}"
                  )
              pkg_info_file = archive.extractfile(pkg_info_members[0])
              if pkg_info_file is None:
                  raise SystemExit("::error::Could not read sdist PKG-INFO")
              sdist_metadata = BytesParser().parsebytes(
                  pkg_info_file.read(), headersonly=True
              )

          for artifact, metadata in (
              (wheels[0].name, wheel_metadata),
              (sdists[0].name, sdist_metadata),
          ):
              if metadata["Name"] != expected_name:
                  raise SystemExit(
                      f"::error::{artifact} has Name={metadata['Name']!r}; "
                      f"expected {expected_name!r}"
                  )
              if metadata["Version"] != expected:
                  raise SystemExit(
                      f"::error::{artifact} has Version={metadata['Version']!r}; "
                      f"expected {expected!r}"
                  )
              print(f"Validated {artifact}: {expected_name}=={expected}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub environment gates the upload — configure required reviewers
    # on `pypi` so a human approves before any real PyPI publish.
    environment: ${{ inputs.target }}
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to ${{ inputs.target }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Empty repository-url => upload.pypi.org (production PyPI).
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          packages-dir: dist/
          print-hash: true

  github-release:
    needs: publish
    if: ${{ inputs.target == 'pypi' && inputs.mode == 'compat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install version and certificate parsers
        run: python -m pip install 'packaging==26.0' 'cryptography==46.0.7'
      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.expected-version }}
        run: |
          python tools/finalize_release.py \
            --repo "$RELEASE_REPO" --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"
