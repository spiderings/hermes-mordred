[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hermes-mordred"
# Version is sourced dynamically from src/mordred_hermes/__about__.py (see
# [tool.hatch.version] below) rather than hardcoded here. The single source
# of truth lives inside the importable package so sdist->wheel builds — which
# run in an isolated dir without the repo's docs tree — can still resolve it.
# Bump everything in lockstep via `tools/bump_version.py`.
dynamic = ["version"]
description = "Privacy-preserving plugin bundle for the Hermes agent (NousResearch/hermes-agent)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "InternetMaximalism" }]
license = { text = "MIT" }
keywords = ["hermes", "agent", "privacy", "tor", "vpn", "keyvault"]

dependencies = [
  # 0.13.0 is hermes-agent's first PyPI release — the old 0.11.0 floor
  # predates PyPI publication (source-install era) and is not installable
  # (`pip install hermes-agent==0.11.0` → "No matching distribution";
  # discovered by the hermes-floor CI job's first run, 2026-07-15). The
  # floor is exercised in CI: hermes-floor pins ==0.13.0 and runs the unit
  # suite minus the two latest-tracking drift detectors (see ci.yml).
  "hermes-agent>=0.13.0",
  "ruamel.yaml>=0.18",
  "psutil>=7.2.2",
]

[project.optional-dependencies]
# Cross-platform crypto stack for the keyvault package. Kept separate
# from `macos` so Linux CI installs it too and `mypy --strict src` can
# resolve blake3 / argon2 / cryptography — these packages are
# cross-platform even though the keyvault *feature* (Secure Enclave) is
# macOS-only. The macOS gate is the pyobjc bridges in `macos` below.
keyvault = [
  "argon2-cffi>=23",
  "cryptography>=42",
  "blake3>=0.4",
]
# Browser-extension WebSocket API server and wallet RPC transport
# (mordred_hermes.extension). Kept out of the base install so users who only
# want the tor/keyvault plugins don't pull it. CI installs this extra so
# `mypy --strict src` and pytest can resolve the extension modules.
extension = [
  "aiohttp>=3.9",
  # Discord context lookups must follow Tor with remote DNS. aiohttp has no
  # native SOCKS transport; aiohttp-socks provides the explicit connector.
  "aiohttp-socks>=0.10",
  # pairing/crypto hard-import cryptography at module scope; until now it only
  # rode along transitively via hermes-agent's own pin, which this extra must
  # not silently depend on.
  "cryptography>=42",
  # Wallet JSON-RPC uses requests for an explicit gateway-selected proxy and
  # urllib3 directly for DNS-pinned HTTPS. Both are direct runtime imports;
  # do not rely on hermes-agent's transitive dependency graph.
  # Tor routes use socks5h://. Requests requires its own PySocks backend;
  # hermes-agent's httpx/socksio dependency does not satisfy that import.
  "requests[socks]>=2.32",
  "urllib3>=2",
]
macos = [
  # Everything keyvault needs on a Mac = the cross-platform crypto stack
  # (recursive extra) plus the pyobjc Security-framework bridges.
  "hermes-mordred[keyvault]",
  "pyobjc-framework-Security>=10.0",
  # Phase 4 PR5: SCNetworkReachability probe for keyvault.network_fallback
  # (OS-API network-blackout fallback when mordred_network is absent).
  "pyobjc-framework-SystemConfiguration>=10.0",
  # Phase 4 PR7: CGScreenIsBeingCaptured probe for keyvault.seed_display
  # (best-effort screenshot detection during the Seed display window, M5).
  "pyobjc-framework-Quartz>=10.0",
]
# Phase 3 PR3a Task #5: Tor ControlPort cookie auth + `GETINFO circuit-status`
# liveness probe. Optional because (a) stem's last release was 2021-12 so we
# don't want to make every Mordred user inherit that supply-chain risk, and
# (b) the shallow `process.poll()` fallback covers lenient/off operators who
# don't need the deeper M9 liveness signal. Strict-mode operators install
# with `pip install hermes-mordred[tor-control]`.
ethereum = [
  # keyvault crypto stack is a prerequisite (AES-GCM encrypt/decrypt).
  "hermes-mordred[keyvault]",
  # secp256k1 key operations + EIP-55 address derivation + signing.
  "eth-keys>=0.6",
  # keccak256 backend required by eth-keys via eth-hash.
  "eth-hash[pycryptodome]>=0.5",
  # EIP-191/EIP-712 message hashing (keyvault/extension_sign.py personal_sign
  # / sign_typed_data_v4) and legacy/EIP-1559 transaction RLP encoding
  # (sign_transaction). Both were previously undeclared even though the
  # module imports them at call time.
  "eth-account>=0.13",
  "rlp>=4",
]
messaging = [
  # Terminal QR-code rendering for `hermes-mordred extension pair`. Optional
  # (the command already falls back to printing the code as plain text when
  # this isn't installed) — was referenced in a comment as living in this
  # extra before the extra itself existed.
  "qrcode>=7.4",
]
tor-control = [
  "stem>=1.8.0,<2",
]
# Read-only Telegram import for the extension server
# (mordred_hermes.extension.telegram). Telethon speaks MTProto as a user
# client; python-socks gives it the explicit Tor/proxy route. Optional because
# only operators who import their own Telegram account need it.
telegram = [
  "hermes-mordred[extension]",
  "telethon>=1.40,<2",
  "python-socks[asyncio]>=2.4",
]
# Real-traffic SOCKS5h library and provider-transport verification dependencies.
# Heavy and optional — only the `integration-tor` CI job
# and operators running `pytest -m integration` need it. The SOCKS
# client libraries back `tests/integration/test_socks5h_libs.py`; the
# provider SDKs back `test_provider_transport.py` and are
# import-or-skipped, so a partial install still runs what it can.
integration = [
  "httpx[socks]>=0.27",
  "requests[socks]>=2.32",
  "aiohttp-socks>=0.10",
  "anthropic>=0.40",
  "openai>=1.40",
  # >=1.20: floor where google.genai.types.HttpOptions(base_url=...) is
  # stable — test_provider_transport.py builds the client with it.
  "google-genai>=1.20",
  "boto3>=1.34",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  # Pin the linters exactly. CI installs this extra with unpinned pip, so a
  # floating ruff/mypy silently reformats or re-type-checks the whole tree on
  # every new release and turns CI red with no code change (an unpinned float
  # to ruff 0.15.15 did exactly this). Pin to the locked version so local (uv)
  # and CI (pip) always run identical formatters and rules; bump deliberately,
  # reformatting in the same commit.
  "ruff==0.15.13",
  "mypy==2.1.0",
]

# One plugin, `mordred`. mordred_hermes.plugin.register() wires every
# component (keyvault, llm_guard, network, privacy_check, e2e, wizard) in a
# fixed order. Releases up to 0.1.0a20 shipped six entry points
# (mordred_network, mordred_privacy_check, ...); config writers migrate those
# names in plugins.enabled/disabled (mordred_hermes._plugin_identity).
# Hermes builds entry-point manifests from the entry-point name plus the
# distribution's version and Summary; it never reads a plugin.yaml for them.
# The entry point names the MODULE (not module:register): the Hermes loader
# calls ep.load() and then getattr(module, "register").
[project.entry-points."hermes_agent.plugins"]
mordred = "mordred_hermes.plugin"

# Standalone console script -- `hermes-mordred ...` always works.
# Historically it was the ONLY form: Hermes did not iterate
# PluginManager._cli_commands when building its argparse subparsers (only
# `plugins.memory.discover_plugin_cli_commands` was consulted; observed at
# hermes_cli/main.py:9728-9740 in 0.11.0, still true on 0.18.2 as verified
# 2026-07-08), so the wizard's ctx.register_cli_command("mordred", ...) was
# silently dropped at parser-construction time.
#
# Upstream has since wired it: hermes-agent 0.19.0 calls discover_plugins()
# and then iterates get_plugin_manager()._cli_commands.values()
# (hermes_cli/main.py:13766-13778), so the registered host subcommand now works
# too. It remains a compatibility alias; `hermes-mordred` is the canonical
# user-facing spelling. Both entry points coexist; verified 2026-08-03 on
# 0.19.0.
#
# Keep this console_script regardless: the dependency floor is
# hermes-agent>=0.13.0, and on 0.13.0-0.18.x the registered host subcommand
# still falls through to top-level usage. The console script is also the only
# form available before `configure` enables the plugin in
# ~/.hermes/config.yaml, since the subcommand is registered by the
# `mordred` plugin's wizard component.
[project.scripts]
hermes-mordred = "mordred_hermes.wizard.cli:main"

[project.urls]
Documentation = "https://github.com/mordredagent/hermes-mordred/tree/main/docs"
Source = "https://github.com/mordredagent/hermes-mordred"

[tool.mordred]
min-hermes-version = "0.13.0"

# Dynamic version source. Hatchling's built-in regex source reads the
# `__version__ = "..."` assignment from the file below. It must live under
# src/ (shipped in both sdist and wheel) so a wheel built from the sdist —
# where docs/ is absent — still resolves the version. See
# src/mordred_hermes/__about__.py for why the canonical value lives there.
[tool.hatch.version]
path = "src/mordred_hermes/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mordred_hermes"]

# Ship the Secure Enclave helper's Swift *sources* inside the package (NOT the
# Swift `.build/` artifacts) so `hermes-mordred keyvault enable-se` can build
# them after a plain `pip install`. `_seckey_helper._locate_helper_source()`
# finds them via importlib.resources at `mordred_hermes/_native/sekey-helper/`.
[tool.hatch.build.targets.wheel.force-include]
"native/sekey-helper/build.sh" = "mordred_hermes/_native/sekey-helper/build.sh"
"native/sekey-helper/Package.swift" = "mordred_hermes/_native/sekey-helper/Package.swift"
"native/sekey-helper/Sources" = "mordred_hermes/_native/sekey-helper/Sources"
"native/sekey-helper/README.md" = "mordred_hermes/_native/sekey-helper/README.md"
# The Linux TPM 2.0 helper's Rust *sources* (NOT the cargo `target/` artifacts)
# so `hermes-mordred keyvault enable-tpm` can build them after a plain
# `pip install`. `_seckey_helper._locate_tpmkey_source()` finds them via
# importlib.resources at `mordred_hermes/_native/tpmkey-helper/` (v2-OS2 2c).
"native/tpmkey-helper/build.sh" = "mordred_hermes/_native/tpmkey-helper/build.sh"
"native/tpmkey-helper/Cargo.toml" = "mordred_hermes/_native/tpmkey-helper/Cargo.toml"
"native/tpmkey-helper/Cargo.lock" = "mordred_hermes/_native/tpmkey-helper/Cargo.lock"
"native/tpmkey-helper/src" = "mordred_hermes/_native/tpmkey-helper/src"
"native/tpmkey-helper/README.md" = "mordred_hermes/_native/tpmkey-helper/README.md"
"native/winkey-helper/build.ps1" = "mordred_hermes/_native/winkey-helper/build.ps1"
"native/winkey-helper/Cargo.toml" = "mordred_hermes/_native/winkey-helper/Cargo.toml"
"native/winkey-helper/Cargo.lock" = "mordred_hermes/_native/winkey-helper/Cargo.lock"
"native/winkey-helper/src" = "mordred_hermes/_native/winkey-helper/src"
"native/winkey-helper/tests" = "mordred_hermes/_native/winkey-helper/tests"
"native/winkey-helper/README.md" = "mordred_hermes/_native/winkey-helper/README.md"
# config.yaml at-rest transparent decrypt (ROADMAP v2-F8). The .pth lands at the
# site-packages root and runs a cheap inline guard at every interpreter start;
# only a Hermes invocation (or MORDRED_CONFIG_DECRYPT=1) imports _pth_bootstrap.
# Opt-in at runtime via `hermes-mordred vault enable-config-decrypt` (the marker);
# absent that marker the hook is a no-op even for Hermes.
"packaging/pth/mordred_hermes_config_decrypt.pth" = "mordred_hermes_config_decrypt.pth"
# Runtime guards that must precede model-client construction and must not
# depend on any entry-point plugin being present in ``plugins.enabled``.
# The inline .pth gate engages only for a Hermes console process; the imported
# module installs a loopback proxy bypass and the mandatory integrity hook.
"packaging/pth/mordred_hermes_runtime.pth" = "mordred_hermes_runtime.pth"
# The offline verification-digest tool for `keyvault init`. Deliberately a
# standalone file (stdlib + blake3 only) the operator copies to the air-gapped
# second device; shipped in the wheel so the init banner can print a path that
# exists after a plain `pip install`, not only in a repo clone.
# `wizard._keyvault_init._locate_offline_digest_script()` resolves it.
"scripts/keyvault_offline_digest.py" = "mordred_hermes/_offline/keyvault_offline_digest.py"

[tool.hatch.build.targets.sdist]
# /packaging/pth ships the config-decrypt .pth that the wheel force-includes
# (above). Without it, a wheel built FROM the sdist — which is what
# `python -m build` and release.yml do — fails with "Forced include not
# found". The name-reservation stub elsewhere under /packaging is
# intentionally NOT shipped (it is a separate distribution).
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml", "/native", "/packaging/pth", "/scripts"]
# Hatchling only respects the ROOT .gitignore, not the nested ones inside the
# native helper crates (native/tpmkey-helper/.gitignore, sekey-helper's), so a
# local build from a checkout that has compiled the helpers vacuums the build
# artifacts into the sdist (~26 MB of cargo target/ observed vs ~770 KB clean;
# 2026-07-08 release note, CI.md §Normal release). CI's clean checkouts never
# hit this, but exclude them explicitly so local and CI sdists are identical.
exclude = [
  "native/tpmkey-helper/target",
  "native/winkey-helper/target",
  "native/sekey-helper/.build",
  # Dev-era PoC harnesses for the extension plugin; their behavior is
  # mirrored by tests/extension/, so downstream builds don't need them.
  "scripts/poc_*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Codex review (2026-05-14, P2-1): default unit-test runs must skip
# integration tests so `pytest` on a Linux dev box with Docker doesn't
# spin up the Tor container. The dedicated `integration-tor` /
# `integration-vpn` CI jobs opt back in via `-m integration`.
addopts = "-q --strict-markers -m 'not integration'"
markers = [
    "integration: requires external services, live network, or device hardware; excluded from default runs",
    "memory_plain: run without the autouse 'agent memory is encrypted' stub (Telegram guard tests)",
]
xfail_strict = true

[tool.coverage.run]
source = ["src/mordred_hermes"]

[tool.coverage.report]
# CI coverage floor — enforces the project's 80% minimum (code-review
# standard) on every `pytest --cov` run, per matrix cell. pytest-cov reads
# this automatically. The floor is 80, not the ~89% observed on macOS,
# because the gate must also pass on the Linux runner where the macOS-only
# pyobjc/ctypes Secure-Enclave paths (_seckey_ctypes, _PyobjcSecKeyOps,
# _anchor_keychain ops) don't execute — pulling that matrix cell to ~85%.
# Ratchet upward once a Linux CI run confirms the true floor.
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: simplify, RUF: ruff-specific. C901 + PLR0912/PLR0915 are the
# function-complexity caps (cyclomatic complexity / branches / statements).
# They were enabled (Tier C) once the Tier A + Tier B refactors brought every
# hotspot under threshold, so the gate now prevents silent regression.
# PLR0913 (too-many-args) is deliberately NOT enabled — the crypto signers
# take intentional keyword-only params, which is good design, not a smell.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C901", "PLR0912", "PLR0915"]
ignore = []

# Explicit complexity thresholds. These equal ruff's current defaults and are
# pinned here so a future ruff default change can't silently loosen the gate.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Complexity caps target production-code maintainability. Test functions are
# intentionally long (arrange-act-assert across many cases) and splitting them
# hurts readability, so tests are exempt from the complexity rules ONLY — all
# other lint rules still apply to tests.
"tests/**" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.format]
# Defaults are intentional: double quotes, trailing commas auto, LF.

[tool.mypy]
strict = true
python_version = "3.11"
# tools/ holds dev-only scripts (e.g. bump_version.py). Type-check them too so
# a regression there is caught by the standard `mypy` run, not just an ad-hoc
# invocation. tests/ stays out (large legacy surface, separate effort).
files = ["src/mordred_hermes", "tools"]
warn_unused_ignores = true
warn_redundant_casts = true

# Phase 0: hermes_cli has no published stubs — ignore its types only.
# follow_imports = "skip" prevents mypy from descending into the upstream
# package and tripping on its own (unrelated) typing/syntax issues.
# hermes_constants is a sibling top-level module from the upstream Hermes
# package; we use get_hermes_home() for profile-aware path resolution.
# providers / providers.base are also upstream Hermes — Phase 2 PR1
# llm_guard.local_adapter subclasses ``providers.base.ProviderProfile`` to
# register the ``mordred-local`` synthetic provider.
[[tool.mypy.overrides]]
module = ["hermes_cli", "hermes_cli.*", "hermes_constants", "providers", "providers.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Untyped third-party modules with no stubs:
# - eth-keys / eth-account / rlp / eth-hash live in the optional `ethereum`
#   extra, which CI does not install (only `dev` / `keyvault` / `macos`), so
#   keyvault/ethereum.py and keyvault/extension_sign.py must type-check without
#   them present.
# - objc (pyobjc) is the macOS-only Security/CoreFoundation bridge used by
#   keyvault/_seckey_ctypes.py; it ships no py.typed marker and is absent on the
#   Linux runner entirely.
# - qrcode lives in the optional `messaging` extra (also not installed for the
#   mypy job); the extension-pair CLI imports it lazily.
# - gateway is a repo-root top-level package (not under mordred-hermes/src), so
#   it isn't importable from the mordred-hermes mypy run; the extension-pair CLI
#   only imports it lazily at runtime.
# Treat all as untyped so `mypy --strict src` resolves cross-platform.
[[tool.mypy.overrides]]
module = [
    "psutil",
    "psutil.*",
    "eth_keys",
    "eth_keys.*",
    "eth_account",
    "eth_account.*",
    "rlp",
    "rlp.*",
    "eth_hash",
    "eth_hash.*",
    "qrcode",
    "qrcode.*",
    # run_agent is a repo-root top-level Hermes module (like gateway); the
    # extension chat bridge imports AIAgent from it lazily at runtime.
    "run_agent",
    "run_agent.*",
    # requests lives in the `integration` extra (not installed for the mypy
    # job); the extension RPC client imports it lazily.
    "requests",
    "requests.*",
    "objc",
    # stem lives in the optional `tor-control` extra. CI does not install it, so
    # `paths/tor.py`'s lazy `from stem.control import Controller` is an
    # unresolvable import there (import-not-found) — but a DEV box synced with
    # `--all-extras` DOES have it, and stem ships no py.typed, so the same line
    # becomes import-untyped instead. An inline `type: ignore[...]` can only name
    # one of those codes, so it necessarily false-fails in one of the two
    # environments (and `warn_unused_ignores` turns the mismatch into a hard
    # error). Declaring the module here covers both codes and keeps `mypy` green
    # locally and in CI without an environment-dependent ignore at the call site.
    "stem",
    "stem.*",
    # telethon lives in the optional `telegram` extra and ships no py.typed;
    # extension/telegram/client.py imports it lazily.
    "telethon",
    "telethon.*",
]
ignore_missing_imports = true

# hermes-agent now ships a top-level `gateway` package, so mypy can RESOLVE it —
# at which point `ignore_missing_imports` no longer applies and attr-defined
# fires for members a given hermes-agent build may not expose (the lazy
# `from gateway import extension_pairing` in wizard/extension_pair_cli.py, guarded
# by try/except ImportError at runtime). `follow_imports = "skip"` treats gateway
# as opaque in BOTH the installed and not-installed cases, so the same config
# stays green whether or not the floating hermes-agent dep ships `gateway`.
[[tool.mypy.overrides]]
module = ["gateway", "gateway.*"]
follow_imports = "skip"
ignore_missing_imports = true
