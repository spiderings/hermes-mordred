# Historical PyPI name-reservation stub; this is not the real package.
#
# This is NOT the real Mordred plugin bundle. It is an intentionally
# empty `0.0.0.dev0` distribution whose only job is to claim the
# `mordred-hermes` name on TestPyPI/PyPI *before* the public docs
# launch, preventing name-squat / supply-chain attacks.
#
# Build + upload happen via `.github/workflows/release.yml` in
# `mode=reserve`. The old-name project is now continued by
# `packaging/mordred-hermes-compat/` in `mode=compat`; this immutable source is
# retained only to reproduce and audit the already-published reservation.
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mordred-hermes"
version = "0.0.0.dev0"
description = "Historical name-reservation placeholder for the Mordred privacy plugin bundle"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "InternetMaximalism" }]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/mordredagent/hermes-mordred"
Source = "https://github.com/mordredagent/hermes-mordred"

[tool.hatch.build.targets.wheel]
packages = ["src/mordred_hermes"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]
