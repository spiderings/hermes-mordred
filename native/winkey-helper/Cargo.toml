[package]
name = "mordred-hermes-winkey"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "winkey_helper"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
lto = true
